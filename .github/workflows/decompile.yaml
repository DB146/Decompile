name: Decompile APK with JADX

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'Path to the APK file in the repo'
        required: true
        default: 'app.apk'

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and install JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.5.1 --repo skylot/jadx --pattern "jadx-1.5.1.zip" -O jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile APK
        run: |
          ./jadx/bin/jadx --no-fail -d decompiled_output "${{ github.event.inputs.apk_path }}"

      - name: Upload decompiled source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jadx-decompiled-source
          path: decompiled_output/

